name: Generate Contribution Pac-Man

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-contribution-pacman
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Pac-Man animation files
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=%237C3AED&color_dots[]=0d0117&color_dots[]=3b0764&color_dots[]=6b21a8&color_dots[]=9333ea&color_dots[]=c084fc
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23A855F7&color_dots[]=0d0117&color_dots[]=3b0764&color_dots[]=6b21a8&color_dots[]=9333ea&color_dots[]=c084fc
            dist/github-contribution-grid-snake.gif?palette=github-dark&color_snake=%23A855F7

      - name: Publish Pac-Man animation to output branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
          force_orphan: true
